limit_req_zone $binary_remote_addr zone=qiqc_login:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=qiqc_requests:10m rate=10r/s;
log_format qiqc_private '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 173.249.36.41;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/qiqc-acme;
        default_type text/plain;
    }
    location / { return 308 https://173.249.36.41$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 173.249.36.41;
    ssl_certificate /etc/letsencrypt/live/qiqc-demo-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qiqc-demo-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:QIQCSSL:10m;
    ssl_session_timeout 10m;
    server_tokens off;
    if ($host != "173.249.36.41") { return 444; }
    client_max_body_size 21m;
    client_body_timeout 60s;
    keepalive_timeout 30s;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log /var/log/nginx/qiqc-access.log qiqc_private;
    error_log /var/log/nginx/qiqc-error.log warn;

    # The staff sign-in page is public; Go enforces changed-password admin
    # sessions on every /api/admin endpoint, including reads and mutations.
    # Staff AI assistant: long model reasoning; same proxy settings, longer timeout.
    location = /api/admin/assistant {
        limit_req zone=qiqc_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:19890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
        proxy_cookie_flags ~^qiqc_(staff_|team_)?session$ secure httponly samesite=strict;
    }
    location ~ ^/(admin|api/admin)(/|$) {
        limit_req zone=qiqc_requests burst=30 nodelay;
        include /etc/nginx/snippets/qiqc-proxy.conf;
    }
    location ~ /\. { return 404; }
    location = /api/login {
        limit_req zone=qiqc_login burst=3 nodelay;
        include /etc/nginx/snippets/qiqc-proxy.conf;
    }
    location / {
        limit_req zone=qiqc_requests burst=60 nodelay;
        include /etc/nginx/snippets/qiqc-proxy.conf;
    }
}
