# Installs as /etc/systemd/system/qiqc-native-api.service.d/assistant.conf.
# Staff console assistant: GPT_BASE_URL and GPT_API_KEY live in a root-only
# env file; the operations manual is copied under config/ (ProtectHome hides /root).
[Service]
EnvironmentFile=/opt/qiqc-native-candidate/config/assistant.env
Environment=QIQC_ASSISTANT_MODEL=gpt-6-sol
Environment=QIQC_ASSISTANT_FALLBACK_MODEL=gpt-5.6-sol
Environment=QIQC_ASSISTANT_EFFORT=high
Environment=QIQC_ASSISTANT_KNOWLEDGE=/opt/qiqc-native-candidate/config/assistant/operations-manual.en.md
