version = "1.0"
[metadata]
author_name = "QIQC organizer"
category = "infrastructure-mock"
description = "Public arithmetic mock; no hidden quantum data."
[agent]
timeout_sec = 180
setup_timeout_sec = 60
[environment]
docker_image = "qiqc-demo-agent:local"
cpus = 1
memory_mb = 1024
[verifier]
timeout_sec = 30
environment_mode = "separate"
[verifier.environment]
docker_image = "qiqc-demo-verifier:local"
[[artifacts]]
source = "/workspace/answer.json"
